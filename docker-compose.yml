services:
  postgres-setup:
    image: pgvector/pgvector:pg15
    container_name: iam-postgres-setup
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: >
      sh -c "
        psql -h lab-postgres -U ${POSTGRES_USER:-postgres} -c 'CREATE DATABASE iam_db;' || true &&
        echo 'DB iam_db ready.'
      "
    networks:
      - lab-network

  iam-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: iam-service
    environment:
      DB_HOST: lab-postgres
      DB_PORT: 5432
      # ACC-E02 T5: dos credenciales DISTINTAS, no dos usuarios con el mismo
      # password. Si compartieran secreto, comprometer la credencial pre-auth
      # (iam_login, la superficie expuesta al mundo) entregaría account_app y
      # el split de roles no aislaría nada.
      # Los defaults son de LAB. En prod se overridean por env (pendiente de
      # definir dónde viven: no van en este archivo).
      DB_USER: account_app
      DB_PASSWORD: ${IAM_APP_DB_PASSWORD:-lab_account_app}
      DB_LOGIN_USER: iam_login
      DB_LOGIN_PASSWORD: ${IAM_LOGIN_DB_PASSWORD:-lab_iam_login}
      DB_NAME: iam_db
      DB_SSLMODE: disable
      GIN_MODE: debug
      LOG_LEVEL: debug
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-me-in-production-min-32-chars}
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - iam_go_mod_cache:/go/pkg/mod
    depends_on:
      - postgres-setup
    networks:
      - lab-network
    labels:
      - "logging=promtail"
      - "service_name=iam-service"

volumes:
  iam_go_mod_cache:
    driver: local

networks:
  lab-network:
    external: true
