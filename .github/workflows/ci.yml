# CI incremental — corre solo los tests de los paquetes que el diff afectó (PLAT-E21 T3).
# Usa scripts/affected-packages.sh (T2): un solo salto de dependientes directos, con
# fallback a todo el módulo si go.mod/go.sum cambió.
#
# Dispara también en push directo (no solo pull_request) porque el owner trabaja solo
# en todo el lab y no abre PRs — sin esto el job quedaría inerte.
#
# ⚠️ Este es HOY el único workflow que corre en push. El `go test ./...` completo vivía
# en deploy.yml, que está apagado desde 2026-07-05 (y sin trigger `push` desde
# 2026-08-27, ver su cabecera). O sea: en push a master corre el subconjunto afectado,
# no la suite entera. Si eso no alcanza, el lugar de la suite completa es acá, no
# resucitar deploy.yml.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-affected:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/mercadocercano
      GONOSUMDB: github.com/mercadocercano

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private modules
        run: |
          git config --global url."https://${{ secrets.GO_PRIVATE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Detect affected packages
        id: affected
        env:
          # pull_request trae el base real; push (sin PR) solo trae "before" (commit
          # previo en esa rama) — no hay pull_request.base.sha en ese evento.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          PACKAGES="$(./scripts/affected-packages.sh "${BASE_SHA}" "${HEAD_SHA}")"
          {
            echo "packages<<CI_PKGS_EOF"
            echo "${PACKAGES}"
            echo "CI_PKGS_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "${PACKAGES}" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
          else
            echo "count=$(printf '%s\n' "${PACKAGES}" | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          fi
          # Total del módulo — para reportar cuántos paquetes se saltaron (T4).
          echo "total=$(go list ./... | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Run tests (affected packages only)
        id: run-tests
        if: steps.affected.outputs.count != '0'
        env:
          AFFECTED_PACKAGES: ${{ steps.affected.outputs.packages }}
          AFFECTED_COUNT: ${{ steps.affected.outputs.count }}
        run: |
          echo "Corriendo ${AFFECTED_COUNT} paquete(s) afectado(s):"
          echo "${AFFECTED_PACKAGES}"
          START=$(date +%s)
          set +e
          # shellcheck disable=SC2086
          go test -race -timeout 120s ${AFFECTED_PACKAGES}
          RC=$?
          set -e
          # Duración escrita SIEMPRE (incluso si los tests fallan) para el reporte de T4.
          echo "duration_s=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"
          exit $RC

      - name: Run vet (affected packages only)
        if: steps.affected.outputs.count != '0'
        env:
          AFFECTED_PACKAGES: ${{ steps.affected.outputs.packages }}
        run: |
          # shellcheck disable=SC2086
          go vet ${AFFECTED_PACKAGES}

      # PLAT-E21 T5 — gate de cobertura del diff vs coverage-baseline.json.
      # Corre los tests afectados con -coverpkg=./src/... (caveat T1: tests externos en
      # test/...), mide la cobertura de las líneas NUEVAS/MODIFICADAS del diff y falla
      # el job si queda por debajo del umbral coverage_percent del baseline. Self-contained
      # (corre su propio coverprofile) para no alterar el paso de tests de T3 (verificado);
      # soporta --coverprofile para reusar el de T3 si se quiere evitar la doble corrida.
      - name: Coverage gate (diff vs baseline)
        if: steps.affected.outputs.count != '0' && steps.run-tests.outcome == 'success'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          ./scripts/coverage-gate.sh "${BASE_SHA}" "${HEAD_SHA}"

      - name: No affected packages
        if: steps.affected.outputs.count == '0'
        run: echo "El diff no tocó .go/go.mod/go.sum — nada que testear."

      # PLAT-E21 T4 — reporte de métricas de ejecución: qué corrió, qué se saltó, tiempo total.
      # Escribe al job summary (pestaña del job) y espeja a stdout como evidencia en el log.
      - name: Execution metrics summary
        if: always()
        env:
          AFFECTED_PACKAGES: ${{ steps.affected.outputs.packages }}
          AFFECTED_COUNT: ${{ steps.affected.outputs.count }}
          TOTAL_COUNT: ${{ steps.affected.outputs.total }}
          DURATION_S: ${{ steps.run-tests.outputs.duration_s }}
          TEST_OUTCOME: ${{ steps.run-tests.outcome }}
        run: |
          RAN="${AFFECTED_COUNT:-0}"
          TOTAL="${TOTAL_COUNT:-?}"
          if [ "${TOTAL}" != "?" ] && [ -n "${RAN}" ]; then
            SKIPPED=$(( TOTAL - RAN ))
          else
            SKIPPED="?"
          fi
          if [ "${RAN}" = "0" ]; then
            DUR="0 (nada que testear)"
            OUTCOME="skipped (sin paquetes afectados)"
          else
            DUR="${DURATION_S:-?}s"
            OUTCOME="${TEST_OUTCOME:-desconocido}"
          fi
          {
            echo "## CI incremental — métricas de ejecución (PLAT-E21 T4)"
            echo ""
            echo "| Métrica | Valor |"
            echo "|---|---|"
            echo "| Paquetes del módulo | ${TOTAL} |"
            echo "| Corridos (afectados por el diff) | ${RAN} |"
            echo "| Salteados | ${SKIPPED} |"
            echo "| Resultado de los tests | ${OUTCOME} |"
            echo "| Tiempo de tests | ${DUR} |"
            echo ""
            if [ "${RAN}" != "0" ]; then
              echo "<details><summary>Paquetes corridos</summary>"
              echo ""
              echo '```'
              printf '%s\n' "${AFFECTED_PACKAGES}"
              echo '```'
              echo ""
              echo "</details>"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # PLAT-E21 T6 — gate arquitectural. Wirea go-hex-audit como check obligatorio de CI,
  # no on-demand. Es un Go test versionado (test/arch/arch_test.go) que corre en cada
  # `go test` y acá en cada push/PR, y falla el job si:
  #   1. hay un package con segmento `port` fuera de `domain/` (criterio literal de T6);
  #   2. domain importa application/infrastructure/api del módulo o libs de infra
  #      (gorm, database/sql, pgx, net/http, gin, ...); application importa
  #      infrastructure/api del módulo o esas libs.
  # Job separado de test-affected para que su señal sea independiente (un fallo de
  # arquitectura no se enmascara detrás de un fallo de tests, ni al revés). Corre SIEMPRE
  # —la arquitectura es un invariante global, no diff-local.
  #
  # ⚠ -count=1 es OBLIGATORIO: arch_test.go no importa ningún package de src/, así que
  # el test binary no cambia cuando cambia src/ y `go test` devolvería PASS cacheado sin
  # correr → el gate quedaría silenciosamente inerte (incluso en CI, donde GOCACHE
  # persiste entre runs). Sin -count=1 el gate NO caza violaciones. Es la trampa
  # "silently disabled" que go-hex-audit §2 advierte sobre tests de arquitectura.
  architecture:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/mercadocercano
      GONOSUMDB: github.com/mercadocercano

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private modules
        # go list ./src/... resuelve el grafo completo, incluido go-shared (privado).
        run: |
          git config --global url."https://${{ secrets.GO_PRIVATE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Architecture gate (hex/DDD)
        run: |
          echo "=== Architecture gate (PLAT-E21 T6) — go-hex-audit como check obligatorio ==="
          go test -count=1 -v ./test/arch/...

      - name: Architecture gate — summary
        if: always()
        run: |
          {
            echo "## Architecture gate (PLAT-E21 T6)"
            echo ""
            echo "Check hexagonal versionado (test/arch/arch_test.go): ports fuera de domain/, regla de dependencia domain/application, libs de infra en domain/application. Corre con -count=1 (sin cache) en cada push/PR."
          } | tee -a "$GITHUB_STEP_SUMMARY"
