# Caller del workflow reusable de imagen (PLAT-E35 T2, definido en hornosg/notifications) para
# iam-service. En push a main/master (y en tags v*) construye, escanea con Trivy y publica
# ghcr.io/hornosg/iam-service:<semver|sha> privado. `secrets: inherit` pasa GITHUB_TOKEN
# (write:packages, automático de Actions) y GO_PRIVATE_TOKEN (módulos privados
# github.com/mercadocercano — mismo secret que ya usan ci.yml/deploy.yml de este repo).
#
# target: production selecciona el stage distroless del Dockerfile (mismo stage que deploy.yml
# usaba para DOCR) — no development/deps.
#
# Estado (PLAT-E35, 2026-09-14): el reusable ya está publicado en hornosg/notifications@main.
# GO_PRIVATE_TOKEN NO hace falta para iam-service: no depende de ningún módulo privado
# (go-shared es público; mercadocercano/* no aparece en go.sum). Verificado con un build
# `--target production` sin token. Si algún día entra un módulo privado, hay que configurarlo.
name: Image — build + scan + push (GHCR)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: hornosg/notifications/.github/workflows/build-push-ghcr.yml@main
    with:
      image-name: iam-service
      target: production
    secrets: inherit
