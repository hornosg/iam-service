# .air.toml file para hot reload de Go
root = "."
tmp_dir = "tmp"

[build]
# Comando para construir — paquete completo, no main.go solo: ACC-E01 T8 movió
# buildRouter a src/router.go y el build single-file quedó roto (el contenedor
# levantaba unhealthy: "undefined: buildRouter" en package command-line-arguments).
# -buildvcs=false: dentro del contenedor el .git montado no es legible como VCS
# ("error obtaining VCS status: exit status 128") y el build muere.
cmd = "go build -buildvcs=false -o ./tmp/main ./src/"
# Binario a ejecutar
bin = "./tmp/main"
# Archivos que se deben vigilar para cambios
include_ext = ["go", "tpl", "tmpl", "html"]
# Directorios a excluir
exclude_dir = ["assets", "tmp", "vendor", ".git"]
# Archivos a excluir
exclude_file = []
# Opciones para depuración
delay = 1000 # ms
stop_on_error = true
log = "air_errors.log"

[log]
# Mostrar log
time = true

[color]
# Colores de los mensajes
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
# Eliminar binarios temporales al salir
clean_on_exit = true